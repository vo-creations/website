name: build

# Catches build-breaking changes before merge. Production deploys from main via
# Vercel's git integration, so a green build here is the gate that keeps a broken
# commit from reaching prod.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Google Fonts sometimes answers with an extensionless /l/font?kit= URL.
      # next/font 14 then throws "Cannot read properties of null (reading '1')".
      # A fresh attempt usually gets a normal .woff2 URL. See docs/DECISIONS.md
      # (topic: next-font-ci-retry-2026-11) and vercel/next.js#99114.
      - name: build
        run: |
          set -eu
          for attempt in 1 2 3; do
            if npm run build; then
              exit 0
            fi
            if [ "$attempt" = "3" ]; then
              exit 1
            fi
            echo "next build failed on attempt ${attempt}, retrying"
            rm -rf .next
            sleep 5
          done
